name: Site check

# Every 2 hours (GitHub may delay scheduled runs) and on demand. A failed run emails the repo owner.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Live site is up and identical to the repository
        env:
          SITE: https://coffee-guy.github.io
          REPO: https://github.com/${{ github.repository }}.git
        run: |
          set -u
          git clone --quiet --depth 1 "$REPO" repo
          cd repo/docs
          # Retries cover the few minutes Pages needs to publish a fresh push.
          for attempt in 1 2 3 4; do
            bad=0
            while IFS= read -r f; do
              want=$(sha256sum "$f" | cut -d' ' -f1)
              got=$(curl -fsS --proto =https --max-time 30 "$SITE/$f?cb=$(date +%s)" | sha256sum | cut -d' ' -f1) || got=unreachable
              if [ "$want" != "$got" ]; then echo "MISMATCH $f"; bad=1; fi
            done < <(git ls-files)
            [ "$bad" = 0 ] && { echo "All live files match the repository."; exit 0; }
            [ "$attempt" -lt 4 ] && sleep 180
          done
          echo "::error::Live site is down or differs from the repository."
          exit 1
