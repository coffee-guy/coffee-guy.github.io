<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 224" width="240" height="224">
  <style>
    .steam path { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: .55; animation: steam 3.6s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: -1.2s; }
    .steam path:nth-child(3) { animation-delay: -2.4s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .65; } 100% { opacity: 0; transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { .steam path { animation: none; } }
  </style>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#737c85"/>
      <stop offset=".13" stop-color="#c9d0d6"/>
      <stop offset=".3" stop-color="#fbfcfd"/>
      <stop offset=".58" stop-color="#bfc7ce"/>
      <stop offset=".87" stop-color="#8b949d"/>
      <stop offset="1" stop-color="#6c757e"/>
    </linearGradient>
    <linearGradient id="bowl-in" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5860"/>
      <stop offset="1" stop-color="#9aa3ab"/>
    </linearGradient>
    <radialGradient id="foam" cx=".42" cy=".4" r=".7">
      <stop offset="0" stop-color="#f9e6c6"/>
      <stop offset=".55" stop-color="#dfae72"/>
      <stop offset="1" stop-color="#a8683a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <ellipse cx="120" cy="212" rx="84" ry="8" fill="#1b0f08" opacity=".35" filter="url(#soft)"/>

  <!-- davara (bowl): inside, spilled coffee, back rim -->
  <ellipse cx="120" cy="138" rx="88" ry="25" fill="url(#bowl-in)"/>
  <ellipse cx="120" cy="150" rx="72" ry="17" fill="#6b3a1d"/>
  <path d="M32,138 A88,25 0 0 1 208,138" fill="none" stroke="#eef1f3" stroke-width="4"/>

  <!-- tumbler -->
  <path d="M72,54 L80,196 L160,196 L168,54 Z" fill="url(#steel)"/>
  <path d="M90,66 L95,66 L98,184 L93,184 Z" fill="#fff" opacity=".45"/>
  <ellipse cx="120" cy="54" rx="48" ry="13" fill="url(#steel)"/>
  <ellipse cx="120" cy="55.5" rx="43.5" ry="10.5" fill="url(#foam)"/>
  <ellipse cx="120" cy="55.5" rx="43.5" ry="10.5" fill="none" stroke="#8c5a31" stroke-opacity=".45"/>
  <g fill="#fff8ea" stroke="#d7a56f" stroke-width=".6" opacity=".92">
    <circle cx="96" cy="56" r="2.6"/>
    <circle cx="108" cy="52" r="2"/>
    <circle cx="125" cy="59" r="3"/>
    <circle cx="137" cy="53.5" r="2.3"/>
    <circle cx="148" cy="57" r="1.8"/>
    <circle cx="112" cy="60" r="1.7"/>
    <circle cx="120" cy="53" r="1.4"/>
    <circle cx="141" cy="60" r="1.5"/>
    <circle cx="90" cy="54" r="1.5"/>
  </g>
  <g fill="#fff8ea" stroke="#cf9a62" stroke-width=".4" opacity=".9">
    <circle cx="100" cy="58" r=".9"/>
    <circle cx="116" cy="56" r="1"/>
    <circle cx="130" cy="56" r=".8"/>
    <circle cx="128" cy="52" r="1.1"/>
    <circle cx="144" cy="55" r=".9"/>
    <circle cx="104" cy="53.5" r=".8"/>
    <circle cx="136" cy="59.5" r="1"/>
    <circle cx="118" cy="61" r=".9"/>
    <circle cx="93" cy="58" r=".8"/>
    <circle cx="150" cy="53" r=".8"/>
    <circle cx="122" cy="57" r=".7"/>
    <circle cx="110" cy="56.5" r=".7"/>
  </g>
  <ellipse cx="112" cy="51.5" rx="17" ry="2.4" fill="#fff" opacity=".35"/>

  <!-- davara front wall hides the lower tumbler -->
  <path d="M32,138 C30,172 40,197 58,202 A62,9 0 0 0 182,202 C200,197 210,172 208,138 A88,25 0 0 1 32,138 Z" fill="url(#steel)"/>
  <path d="M58,160 C56,176 62,190 72,197 L82,198 C72,190 67,176 69,162 Z" fill="#fff" opacity=".35"/>
  <path d="M58,202 A62,9 0 0 0 182,202" fill="none" stroke="#59626b" stroke-width="2" opacity=".55"/>
  <path d="M34,142 A86,24 0 0 0 206,142" fill="none" stroke="#7b848d" stroke-width="1.5" opacity=".6"/>
  <path d="M32,138 A88,25 0 0 0 208,138" fill="none" stroke="#eef1f3" stroke-width="4"/>

  <g class="steam">
    <path d="M104,38 C96,29 112,23 104,13"/>
    <path d="M120,34 C112,25 128,19 120,8"/>
    <path d="M136,38 C128,29 144,23 136,13"/>
  </g>
</svg>
